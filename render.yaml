# One-click backend deploy on Render (dashboard → New → Blueprint → select repo).
services:
  - type: web
    name: careerpath-ai-backend
    env: python
    buildCommand: pip install -r requirements.txt && python scripts/generate_dataset.py && python ml/train.py && python scripts/generate_kb.py && python scripts/build_vector_database.py
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: VECTOR_STORE
        value: tfidf
      - key: PYTHON_VERSION
        value: 3.11.0
